<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매매주</title>
<meta name="theme-color" content="#0D0B08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매매주">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,0.15);
  --deep:#0D0B08;--dark:#1A1712;--card:#211E18;--card2:#2A2620;
  --text:#F0EBE0;--text-dim:#9A9080;--border:rgba(201,168,76,0.2);--radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--deep);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}

/* HEADER */
.site-header{position:relative;background:linear-gradient(160deg,#1a1208,#0D0B08,#12100A);padding:20px 24px 20px;border-bottom:1px solid var(--border);}
.site-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(201,168,76,.1),transparent 70%);pointer-events:none;}
.site-title{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,38px);font-weight:700;color:var(--gold-light);letter-spacing:.02em;}
.site-subtitle{font-size:11px;color:var(--text-dim);margin-top:6px;letter-spacing:.15em;}
.admin-toggle{display:none;}


/* LOGO BTN */
.logo-btn{background:none;border:none;cursor:pointer;padding:4px 0 0;width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;transition:transform .2s;}
.logo-btn:hover{transform:scale(1.08);}
.logo-btn img{width:40px;height:40px;border-radius:10px;object-fit:cover;display:block;}
.logo-btn-label{font-size:10px;font-family:'Noto Sans KR',sans-serif;font-weight:500;color:var(--text-dim);letter-spacing:.02em;}
.header-inner{display:flex;align-items:center;justify-content:center;gap:14px;position:relative;}
/* SHARE BTN */
.share-btn{background:none;border:none;cursor:pointer;padding:4px 0 0;width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;transition:transform .2s;color:var(--gold);}
.share-btn:hover{transform:scale(1.08);}
.share-btn svg{width:26px;height:26px;}
.share-btn-label{font-size:10px;font-family:'Noto Sans KR',sans-serif;font-weight:500;letter-spacing:.02em;}

/* NAV */
.nav-wrapper{position:sticky;top:0;z-index:100;background:rgba(13,11,8,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{flex-shrink:0;padding:12px 14px;font-size:12px;font-weight:500;color:var(--text-dim);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .25s;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-tab .tab-icon{font-size:16px;}
.nav-tab:hover{color:var(--gold-light);}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* SECTIONS */
.page-section{display:none;min-height:60vh;padding:20px 16px 80px;max-width:640px;margin:0 auto;position:relative;}
.page-section.active{display:block;}

/* ADMIN BAR */
.admin-bar{display:none;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.25);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:12px;color:#93c5fd;align-items:center;gap:8px;}
.admin-bar.show{display:flex;}

/* ADD BTN */
.add-btn{display:none;width:100%;background:rgba(37,99,235,.08);border:1px dashed rgba(37,99,235,.3);color:#93c5fd;font-size:13px;padding:13px;border-radius:var(--radius);cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:12px;transition:background .2s;align-items:center;justify-content:center;gap:6px;}
.add-btn:hover{background:rgba(37,99,235,.15);}
body.admin-on .add-btn{display:flex;}

/* EDIT BTN */
.edit-btn{display:none;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);color:#93c5fd;font-size:10px;padding:3px 9px;border-radius:8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:8px;}
body.admin-on .edit-btn{display:inline-flex;align-items:center;gap:3px;}

/* ORDER BTNS */
.order-btns{display:none;position:absolute;left:8px;top:50%;transform:translateY(-50%);flex-direction:column;gap:2px;z-index:2;}
body.admin-on .order-btns{display:flex;}
.order-btn{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:11px;width:22px;height:22px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.order-btn:hover{background:rgba(201,168,76,.35);}

/* PLAYLIST CARD (YouTube) */
.yt-wrap{margin-bottom:18px;}
.playlist-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;position:relative;}
.playlist-card:hover{border-color:rgba(201,168,76,.4);}
body.admin-on .playlist-card{padding-left:36px;}
.pc-thumb{width:100%;aspect-ratio:16/9;background:#111;position:relative;overflow:hidden;cursor:pointer;}
.pc-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pc-thumb-placeholder{width:100%;height:100%;background:linear-gradient(135deg,#1a1712,#2a2218);display:flex;align-items:center;justify-content:center;font-size:40px;}
.pc-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);}
.pc-play-btn{width:54px;height:54px;background:rgba(201,168,76,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--deep);transition:transform .2s;}
.pc-play-btn:hover{transform:scale(1.1);}
.pc-iframe-wrap{width:100%;aspect-ratio:16/9;display:none;}
.pc-iframe-wrap iframe{width:100%;height:100%;border:none;}
.pc-info{padding:12px 14px;}
.pc-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.4;}
.pc-sub{font-size:11px;color:var(--text-dim);}

/* YT EXTERNAL BTN */
.yt-ext-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:rgba(255,0,0,.08);border:1px solid rgba(255,0,0,.2);border-top:none;color:#ff6b6b;font-size:13px;font-weight:600;border-radius:0 0 var(--radius) var(--radius);text-decoration:none;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.yt-ext-btn:hover{background:rgba(255,0,0,.16);color:#ff3333;}

/* COUPANG BTN */
.coupang-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;background:#fff;border:none;border-radius:var(--radius);color:#333;font-size:14px;font-weight:700;font-family:'Noto Sans KR',sans-serif;text-decoration:none;margin-top:6px;cursor:pointer;transition:filter .2s;}
.coupang-btn:hover{filter:brightness(.95);}
.coupang-btn-icon{width:28px;height:28px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.coupang-btn-icon img{width:100%;height:100%;object-fit:cover;border-radius:6px;}

/* LINK CARD */
.link-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;text-decoration:none;color:var(--text);transition:all .2s;position:relative;}
.link-card:hover{border-color:rgba(201,168,76,.4);transform:translateX(3px);}
body.admin-on .link-card{padding-left:44px;}
.lc-icon{width:44px;height:44px;border-radius:10px;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;}
.lc-icon img{width:100%;height:100%;object-fit:cover;}
.lc-body{flex:1;min-width:0;}
.lc-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:3px;}
.lc-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px;}
.lc-sub{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-arrow{color:var(--gold);font-size:18px;opacity:.6;flex-shrink:0;}

/* NOTICE CARD */
.notice-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .2s;}
.notice-card:hover{border-color:rgba(201,168,76,.4);}
.notice-card-header{display:flex;justify-content:space-between;align-items:center;padding:16px;cursor:pointer;gap:10px;}
.notice-card-title{font-size:16px;font-weight:600;color:var(--text);line-height:1.4;flex:1;}
.notice-card-meta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.notice-card-date{font-size:11px;color:var(--gold);opacity:.8;}
.notice-card-arrow{color:var(--text-dim);font-size:14px;transition:transform .25s;}
.notice-card.open .notice-card-arrow{transform:rotate(180deg);}
.notice-card-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);margin-top:0;}
.notice-card.open .notice-card-body{display:block;}
.notice-card-text{font-size:16px;color:var(--text-dim);line-height:1.9;margin-top:14px;white-space:pre-wrap;}
.notice-card-img{width:100%;border-radius:10px;margin-top:12px;display:block;}
.notice-edit-btn{display:none;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);color:#93c5fd;font-size:10px;padding:3px 9px;border-radius:8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:10px;}
body.admin-on .notice-edit-btn{display:inline-flex;align-items:center;gap:3px;}

/* KAKAO BTN */
.kakao-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:#FEE500;border:none;border-radius:var(--radius);color:#3A1D1D;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;text-decoration:none;margin-top:16px;cursor:pointer;transition:filter .2s;}
.kakao-btn:hover{filter:brightness(.95);}

/* HEAVEN LIB BTN */
.heaven-lib-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:linear-gradient(135deg,#6B21A8,#9333EA);border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;text-decoration:none;margin-top:10px;cursor:pointer;transition:filter .2s;}
.heaven-lib-btn:hover{filter:brightness(1.1);}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:18px 0;}

/* EMPTY */
.empty-msg{color:var(--text-dim);font-size:13px;text-align:center;padding:16px 0;}

/* BRANCH */
.branch-search{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;padding:12px 16px;border-radius:var(--radius);outline:none;margin-bottom:14px;}
.branch-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.branch-card:hover{border-color:rgba(201,168,76,.4);}
.branch-name{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--gold-light);margin-bottom:5px;}
.branch-addr{font-size:12px;color:var(--text-dim);margin-bottom:8px;line-height:1.6;}
.branch-note{font-size:11px;color:rgba(201,168,76,.6);margin-bottom:8px;line-height:1.5;font-style:italic;}
.branch-btns{display:flex;gap:8px;flex-wrap:wrap;}
.branch-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;font-family:'Noto Sans KR',sans-serif;text-decoration:none;transition:all .2s;border:1px solid;}
.branch-btn.call{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.25);color:#4ade80;}
.branch-btn.map{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.3);color:var(--gold);}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--dark);border:1px solid var(--border);border-radius:20px;padding:24px 20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;animation:fadeIn .25s ease both;}
.modal-title{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--gold-light);margin-bottom:14px;}
.modal label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;letter-spacing:.05em;}
.modal input,.modal textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:10px;outline:none;transition:border-color .2s;}
.modal input:focus,.modal textarea:focus{border-color:rgba(201,168,76,.5);}
.modal textarea{resize:vertical;min-height:70px;}
.modal-btns{display:flex;gap:8px;margin-top:6px;}
.modal-btn{flex:1;padding:11px;border-radius:10px;border:none;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s;}
.modal-btn.primary{background:var(--gold);color:var(--deep);font-weight:700;}
.modal-btn.primary:hover{background:var(--gold-light);}
.modal-btn.cancel{background:var(--card);color:var(--text-dim);border:1px solid var(--border);}
.modal-btn.danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}

/* IMAGE PREVIEW */
.img-preview-wrap{margin-bottom:10px;}
.img-preview{width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:none;margin-top:6px;}
.img-preview.show{display:block;}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;transition:opacity .4s;}
.loading-overlay.hide{opacity:0;pointer-events:none;}
.loading-cross{font-size:36px;color:var(--gold);margin-bottom:16px;animation:pulse 1.2s ease infinite;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;padding:10px 20px;border-radius:20px;opacity:0;transition:all .3s;z-index:3000;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* FOOTER */
.site-footer{text-align:center;padding:24px 20px;border-top:1px solid var(--border);color:var(--text-dim);font-size:11px;letter-spacing:.1em;}


/* FOOTER ADMIN LINK */
.footer-admin-link{color:var(--text-dim);text-decoration:none;opacity:.5;transition:opacity .2s;}
.footer-admin-link:hover{opacity:1;color:var(--gold);}
/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-cross">✝</div>
  <div style="font-size:13px;color:var(--text-dim)">불러오는 중...</div>
</div>
<div class="toast" id="toast"></div>

<header class="site-header">
  <div class="header-inner">
    <button class="logo-btn" id="logoBtn" onclick="installApp()" title="앱 설치">
      <img src="logo.png" alt="매매주 로고"/>
      <span class="logo-btn-label">앱 설치</span>
    </button>
    <div>
      <h1 class="site-title">매일 매일을 주님께</h1>
      <p class="site-subtitle">EVERYDAY WITH JESUS</p>
    </div>
    <button class="share-btn" onclick="shareApp()" title="공유하기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      <span class="share-btn-label">공유하기</span>
    </button>
  </div>
</header>

<nav class="nav-wrapper">
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" onclick="switchTab('notice',this)"><span class="tab-icon">📢</span>공지</button>
    <button class="nav-tab" onclick="switchTab('prayer',this)"><span class="tab-icon">🙏</span>기도</button>
    <button class="nav-tab" onclick="switchTab('praise',this)"><span class="tab-icon">🎵</span>찬양</button>
    <button class="nav-tab" onclick="switchTab('bible',this)"><span class="tab-icon">📖</span>성경</button>
    <button class="nav-tab" onclick="switchTab('sermon',this)"><span class="tab-icon">🎤</span>설교</button>
    <button class="nav-tab" onclick="switchTab('books',this)"><span class="tab-icon">📗</span>저서별설교</button>
    <button class="nav-tab" onclick="switchTab('healing',this)"><span class="tab-icon">🕊️</span>치유</button>
    <button class="nav-tab" onclick="switchTab('links',this)"><span class="tab-icon">🔗</span>바로가기</button>
    <button class="nav-tab" onclick="switchTab('branch',this)"><span class="tab-icon">⛪</span>지교회</button>
    <button class="nav-tab" onclick="switchTab('truth',this)"><span class="tab-icon">✝</span>진실의 방</button>
  </div>
</nav>

<!-- SECTIONS -->
<section id="tab-notice" class="page-section active">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-notices"></div>
  <button class="add-btn" onclick="openAdd('notices','notice')">＋ 공지 추가</button>
  <a class="kakao-btn" href="https://open.kakao.com/o/sbqrs0jh" target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.477 2 10.5c0 2.688 1.627 5.04 4.09 6.385L5.1 20.4a.5.5 0 0 0 .72.548l4.54-2.63c.54.082 1.09.132 1.64.132 5.523 0 10-3.477 10-7.5S17.523 3 12 3z"/></svg>
    카톡으로 문의하기
  </a>
  <a class="heaven-lib-btn" href="https://influencers.coupang.com/s/kingofsallim" target="_blank" rel="noopener">
    🌍 아프리카 선교 후원
  </a>
</section>

<section id="tab-prayer" class="page-section">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-prayer"></div>
  <button class="add-btn" onclick="openAdd('prayer','link')">＋ 항목 추가</button>
</section>

<section id="tab-praise" class="page-section">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-praise"></div>
  <button class="add-btn" onclick="openAdd('praise','link')">＋ 항목 추가</button>
</section>

<section id="tab-bible" class="page-section">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-bible"></div>
  <button class="add-btn" onclick="openAdd('bible','link')">＋ 항목 추가</button>
</section>

<section id="tab-sermon" class="page-section">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-sermon"></div>
  <button class="add-btn" onclick="openAdd('sermon','link')">＋ 항목 추가</button>
</section>

<section id="tab-books" class="page-section">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-books"></div>
  <button class="add-btn" onclick="openAdd('books','link')">＋ 항목 추가</button>
</section>

<section id="tab-healing" class="page-section">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-healing"></div>
  <button class="add-btn" onclick="openAdd('healing','link')">＋ 항목 추가</button>
</section>

<section id="tab-links" class="page-section">
  <div class="admin-bar"><span>✏️</span> 관리자 모드</div>
  <div id="list-links"></div>
  <button class="add-btn" onclick="openAdd('links','link')">＋ 항목 추가</button>
</section>

<section id="tab-branch" class="page-section">
  <input class="branch-search" placeholder="🔍 지역명 또는 주소 검색..." oninput="filterBranch(this.value)"/>
  <div id="branch-list"></div>
</section>

<section id="tab-truth" class="page-section">

/* ── MIGRATE: 구버전 컬렉션 → 새 컬렉션 ── */
async function migrate(oldKeys, newKey) {
  try {
    const newSnap = await getDocs(collection(db, COL(newKey)));
    if (!newSnap.empty) return;
    let order = 0;
    for (const k of oldKeys) {
      try {
        const snap = await getDocs(collection(db, COL(k)));
        for (const d of snap.docs) {
          await addDoc(collection(db, COL(newKey)), {...d.data(), order:order++, createdAt:serverTimestamp()});
        }
      } catch(e){}
    }
  } catch(e){}
}

/* ── FETCH ── */
async function fetchCol(key) {
  try {
    const snap = await getDocs(collection(db, COL(key)));
    let items = snap.docs.map(d=>({id:d.id,...d.data()}));
    items.sort((a,b)=>(a.order||0)-(b.order||0));
    cache[key] = items.length ? items : (SEED[key]||[]);
  } catch(e) {
    cache[key] = SEED[key]||[];
  }
}

async function seedIfEmpty(key) {
  try {
    const snap = await getDocs(collection(db, COL(key)));
    if (snap.empty && SEED[key]?.length) {
      for (const item of SEED[key]) {
        await addDoc(collection(db, COL(key)), {...item, createdAt:serverTimestamp()});
      }
    }
  } catch(e){}
}

/* ── YOUTUBE HELPERS ── */
function getVid(url){ if(!url)return null; const m=url.match(/(?:youtu\.be\/|[?&]v=)([^&?#]+)/); return m?m[1]:null; }
function getPid(url){ if(!url)return null; const m=url.match(/[?&]list=([^&]+)/); return m?m[1]:null; }
function isYT(url){ return url&&(url.includes('youtube.com')||url.includes('youtu.be')); }
function isChannel(url){ return url&&(url.includes('/@')||url.includes('/channel/')); }
function embedUrl(url){
  const v=getVid(url),p=getPid(url);
  if(v&&p)return`https://www.youtube.com/embed/${v}?list=${p}&autoplay=1`;
  if(v)return`https://www.youtube.com/embed/${v}?autoplay=1`;
  if(p)return`https://www.youtube.com/embed/videoseries?list=${p}&autoplay=1`;
  return null;
}

const thumbCache={};
async function fetchPidThumb(pid){
  if(thumbCache[pid])return thumbCache[pid];
  try{
    const r=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/playlist?list=${pid}&format=json`);
    const d=await r.json();
    const m=d.thumbnail_url?.match(/\/vi\/([^/]+)\//);
    if(m){const t=`https://img.youtube.com/vi/${m[1]}/mqdefault.jpg`;thumbCache[pid]=t;return t;}
  }catch(e){}
  return null;
}

/* ── MOVE ITEM ── */
window.moveItem = (key, id, dir) => {
  const items=[...(cache[key]||[])];
  const idx=items.findIndex(i=>i.id===id);
  if(idx<0)return;
  const ni=idx+dir;
  if(ni<0||ni>=items.length)return;
  [items[idx],items[ni]]=[items[ni],items[idx]];
  items.forEach((item,i)=>item.order=i);
  cache[key]=items;
  renderLinks(key);
  Promise.all(items.map((item,i)=>updateDoc(doc(db,COL(key),item.id),{order:i}))).catch(console.error);
};

function renderBranch(q) {
  const el=document.getElementById('branch-list');
  if(!el)return;
  const filtered = q ? BRANCHES.filter(b=>b.name.includes(q)||b.addr.includes(q)||b.note.includes(q)) : BRANCHES;
  if(!filtered.length){el.innerHTML='<p class="empty-msg">검색 결과가 없습니다</p>';return;}
  el.innerHTML=filtered.map(b=>`
    <div class="branch-card">
      <div class="branch-name">⛪ ${esc(b.name)}</div>
      <div class="branch-addr">📍 ${esc(b.addr)}</div>
      ${b.note?`<div class="branch-note">💡 ${esc(b.note)}</div>`:''}
      <div class="branch-btns">

}

    <label>이미지 첨부 (선택)</label>

      <input type="file" id="ef-img-file" accept="image/*" onchange="previewNoticeImg(this)" style="font-size:12px;color:var(--text-dim)"/>

window.fetchCoupangImg = async () => {
  const url = document.getElementById('ef-coupang')?.value.trim();
  if (!url) { alert('쿠팡 링크를 먼저 입력해주세요'); return; }

  const btn = event.target;
  btn.textContent = '가져오는 중...';
  btn.disabled = true;

  try {
    // allorigins 프록시로 쿠팡 페이지 HTML 가져오기
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    const html = data.contents || '';

    // OG image 추출
    let imgUrl = '';
    const ogMatch = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i)
                 || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
    if (ogMatch) imgUrl = ogMatch[1];

    // 못 찾으면 첫 번째 상품 이미지 시도
    if (!imgUrl) {
      const imgMatch = html.match(/https:\/\/thumbnail\d*\.coupangcdn\.com[^"'>\s]+/);
      if (imgMatch) imgUrl = imgMatch[0];
    }

    if (imgUrl) {
      // iconUrl에 저장
      document.getElementById('ef-icon-url').value = imgUrl;
      document.getElementById('ef-icon').value = '';
      // 아이콘 미리보기 업데이트
      document.getElementById('icon-preview').innerHTML =
        `<img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`;
      // 쿠팡 이미지 미리보기
      const preview = document.getElementById('coupang-img-preview');
      const thumb = document.getElementById('coupang-img-thumb');
      if (preview && thumb) { thumb.src = imgUrl; preview.style.display = 'flex'; }
      showToast('상품 이미지를 가져왔어요 ✓');
    } else {
      showToast('이미지를 찾지 못했어요. 직접 업로드해주세요');
    }
  } catch(e) {
    showToast('이미지 가져오기 실패. 직접 업로드해주세요');
  } finally {
    btn.textContent = '이미지 가져오기';
    btn.disabled = false;
  }
};

window.previewNoticeImg = (input) => {
  if(!input.files?.[0])return;
  const r=new FileReader();
  r.onload=e=>{
    document.getElementById('ef-img-url').value=e.target.result;
    const prev=document.getElementById('ef-img-preview');
    prev.src=e.target.result;
    prev.classList.add('show');
  };
  r.readAsDataURL(input.files[0]);
};

window.previewIcon = (input) => {
  if(!input.files?.[0])return;
  const r=new FileReader();
  r.onload=e=>{
    document.getElementById('ef-icon-url').value=e.target.result;
    document.getElementById('ef-icon').value='';
    document.getElementById('icon-preview').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`;
  };
  r.readAsDataURL(input.files[0]);
};

/* ── SAVE / DELETE ── */
window.saveItem = async () => {
  if(!editCtx)return;
  const {key,type,id}=editCtx;
  let data={};

  if(type==='notice'){
    const title=document.getElementById('ef-title').value.trim();
    if(!title){alert('제목을 입력하세요');return;}
    data={title,body:document.getElementById('ef-body').value.trim(),date:document.getElementById('ef-date').value.trim(),imageUrl:document.getElementById('ef-img-url').value};
  } else {
    const title=document.getElementById('ef-title').value.trim();
    if(!title){alert('이름을 입력하세요');return;}
    const items=cache[key]||[];
    const coupangEl=document.getElementById('ef-coupang');
    data={
      title,
      url:document.getElementById('ef-url').value.trim(),
      sub:document.getElementById('ef-sub').value.trim(),
      label:document.getElementById('ef-label').value.trim(),
      icon:document.getElementById('ef-icon').value.trim(),
      iconUrl:document.getElementById('ef-icon-url')?.value||'',
      coupang:coupangEl?coupangEl.value.trim():'',
      order:id?((items.find(i=>i.id===id)||{}).order||0):items.length
    };
  }

  try {
    if(id){
      await updateDoc(doc(db,COL(key),id),data);
      cache[key]=(cache[key]||[]).map(i=>i.id===id?{...i,...data}:i);
    } else {
      const ref=await addDoc(collection(db,COL(key)),{...data,createdAt:serverTimestamp()});
      cache[key]=[...(cache[key]||[]),{id:ref.id,...data}];
    }
    type==='notice'?renderNotices():renderLinks(key);
    closeEditModal();
    showToast('저장됐습니다 ✓');
  } catch(e){alert('저장 실패: '+e.message);}
};

window.deleteItem = async () => {
  if(!editCtx?.id)return;
  if(!confirm('삭제하시겠습니까?'))return;
  const {key,type,id}=editCtx;
  cache[key]=(cache[key]||[]).filter(i=>i.id!==id);
  type==='notice'?renderNotices():renderLinks(key);
  closeEditModal();
  showToast('삭제됐습니다');
  deleteDoc(doc(db,COL(key),id)).catch(console.error);
};

/* ── TAB ── */
const TAB_ORDER=['notice','prayer','praise','bible','sermon','books','healing','links','branch','truth'];
let currentTabIdx=0;

window.switchTab = (name, btn) => {
  const prevEl=document.querySelector('.page-section.active');
  const nextEl=document.getElementById('tab-'+name);
  const newIdx=TAB_ORDER.indexOf(name);
  const dir = newIdx>currentTabIdx?1:-1;

  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  (btn||document.querySelectorAll('.nav-tab')[newIdx])?.classList.add('active');

  if(prevEl&&prevEl!==nextEl){
    prevEl.style.cssText=`transition:transform .28s ease,opacity .28s ease;transform:translateX(${dir*-100}%);opacity:0`;
    setTimeout(()=>{prevEl.classList.remove('active');prevEl.style.cssText='';},290);
  }
  nextEl.style.cssText=`transform:translateX(${dir*100}%);opacity:0;transition:none`;
  nextEl.classList.add('active');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    nextEl.style.cssText='transition:transform .28s ease,opacity .28s ease;transform:translateX(0);opacity:1';
    setTimeout(()=>nextEl.style.cssText='',300);
  }));

  currentTabIdx=newIdx;
  const activeBtn=btn||document.querySelectorAll('.nav-tab')[newIdx];
  activeBtn?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
};

// 스와이프
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
    const ni=Math.max(0,Math.min(TAB_ORDER.length-1,currentTabIdx+(dx<0?1:-1)));
    if(ni!==currentTabIdx) switchTab(TAB_ORDER[ni],null);
  }
},{passive:true});

/* ── TOAST ── */
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

window.shareApp = async () => {

function copyLink(url) {
  navigator.clipboard?.writeText(url).then(()=>{
    showToast('링크가 복사됐습니다 ✓');
  }).catch(()=>{
    showToast('링크: ' + url);
  });
}
